description = "Execute the cold-agent Walk Test to audit ICM navigation, contracts, and token budgets."
prompt = '''
Execute the cold-agent Walk Test on an ICM workspace to verify navigation, contract integrity, and token budgets.

Input: {{args}}

Follow the Walk Test protocol in `skills/icm-architect/SKILL.md` and `skills/icm-architect/references/core.md`:

1. **Orientation Test (L0–L1)**:
   - Read the root entry file (`HERMES.md`, `CLAUDE.md`, `AGENTS.md`, or `GEMINI.md`) and root `CONTEXT.md`.
   - Can you answer *where am I* and *where do I go for task X* in $\le 3$ file reads without guessing?
2. **Contract Completeness (L2)**:
   - Inspect all stage folders. Does each contain a `CONTEXT.md`?
   - Does each contract declare explicit input paths (split into Working vs. Reference), a numbered process, explicit output paths, and exactly one concrete Human Check?
3. **State Machine Verification (L4)**:
   - Can workspace status be determined purely by inspecting artifacts inside `output/` folders (or node frontmatter)?
   - Flag any placeholder files (like `.gitkeep`) masquerading as completed artifacts.
4. **Catalog Hygiene**:
   - Check if any routing file is carrying content payload. Pointers belong in the catalog; content belongs on shelves.
   - Verify one-home-per-fact: flag duplicated rules, schemas, or descriptions that should be links.
5. **Reference Integrity**:
   - Verify all relative paths, wikilinks, and citations resolve to existing files on disk.
   - For restructured workspaces, verify that pre-existing references did not break.
6. **Token Discipline**:
   - Calculate approximate token counts: Entry file + Stage contract + References + Inputs.
   - Verify active context falls within the healthy **2,000–8,000 token** range. Flag any stage ballooning past 8k.
7. **System Map Audit (if applicable)**:
   - Can a cold agent answer *what is X* and *what else moves if I change X* from `map/CLAUDE.md` plus one card?
   - Verify all cards carry citations (`path:line`) and explicit **Hits / Does not hit** sections.
8. **Report**:
   - Output a clear Pass/Fail checklist with specific file-level remediation recommendations.
'''
