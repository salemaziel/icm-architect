description = "Audit an existing folder or repo and prepare an approved ICM restructuring plan."
prompt = '''
Audit an existing folder, repo or vault and restructure it into an ICM, safely.

Use the `icm-architect` skill; load it if it isn't loaded. Paths below are relative to the skill's folder, except paths in the workspace being worked on.

Input: {{args}}

Follow Restructure mode in `SKILL.md`:
1. **Inventory before touching.** List the tree; for each area note what it is, when it was last touched, and what refers to it. Move and delete nothing in this pass.
2. **Find the hidden form.** The repeating unit, where work enters and leaves. Name the form from `references/forms.md` (Pipeline, Record library, Knowledge bundle, Context map, System map) or the recipe over the three primitives.
3. **Classify every file**: Catalog (`AGENTS.md`, pointer files, index files), Contract (`CONTEXT.md`), Factory (`_shared/`), Product (stage `output/`, record folders), Dead (propose `_archive/`; only after step 4 finds nothing that depends on it).
4. **Find what points at each file.** Links inside the workspace, sibling `../` paths, symlinks, and consumers outside it: other repos, configs, scheduled jobs, agent configs. Ask the owner about the outside ones. Check every destination for a case-folded collision (`context.md` vs `CONTEXT.md`).
5. **Propose the migration map**: old path, new path, role, referrers found, and every case-fold collision. Wait for approval.
6. **Migrate: copy, verify, then remove.** Confirm the tree is tracked or backed up; copy; verify file count and content hash; remove the original only after parity passes, leaving a link where anything referred to it. Write `AGENTS.md`, pointer files and contracts, and dedupe toward one home per fact. If the structure will be reused, keep the blank template apart from this filled-in deployment.
7. **Run the walk test**, including `python -I _tools/links.py` if the workspace has it, and confirm every reference that existed before the move still resolves.
'''
